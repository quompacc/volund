openapi: 3.1.0
info:
  title: VÖLUND catalog API
  version: 1.0.0
  description: Versioned CAD metadata access with explicit managed source moves.
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API and database are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/setup:
    get:
      operationId: getSetupStatus
      responses:
        "200":
          description: First-owner setup state without secret material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /api/v1/setup/owner:
    post:
      operationId: createFirstOwner
      parameters:
        - in: header
          name: X-Volund-Setup-Token
          required: true
          schema:
            type: string
            minLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFirstOwnerRequest"
      responses:
        "200":
          description: The first and only bootstrap owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Setup credentials are invalid.
        "409":
          description: The instance is already initialized.
        "503":
          description: No bootstrap token file is configured.
  /api/v1/sessions:
    get:
      operationId: listOwnSessions
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Active sessions owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnSession"
        "401":
          description: No active session exists.
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session metadata; opaque credentials are returned as cookies only.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Credentials are invalid.
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "204":
          description: Invitation consumed and account activated.
        "400":
          description: The chosen password is invalid.
        "404":
          description: The invitation is invalid, expired, or already consumed.
  /api/v1/sessions/{sessionId}:
    delete:
      operationId: revokeOwnSession
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The selected non-current session was revoked.
        "401":
          description: No active session exists.
        "403":
          description: CSRF verification failed.
        "404":
          description: The session is not owned, is current, or is no longer active.
  /api/v1/session:
    get:
      operationId: getCurrentSession
      responses:
        "200":
          description: The current authenticated browser session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          description: No active session exists.
    delete:
      operationId: logout
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session revoked and cookies cleared.
        "401":
          description: No active session exists.
        "403":
          description: CSRF verification failed.
  /api/v1/account/password:
    put:
      operationId: changeOwnPassword
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeOwnPasswordRequest"
      responses:
        "204":
          description: Password changed and other sessions revoked.
        "400":
          description: The current or new password is invalid.
  /api/v1/users:
    get:
      operationId: listUsers
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Local user inventory for owners and administrators.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
        "403":
          description: User-administration capability is required.
    post:
      operationId: createUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: The active local account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "400":
          description: Account fields are invalid.
        "403":
          description: User-administration or owner capability is required.
        "409":
          description: The email address is already registered.
  /api/v1/users/{userId}:
    patch:
      operationId: updateUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated local account.
  /api/v1/users/invitations:
    post:
      operationId: inviteUser
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "200":
          description: Invited account plus its one-time activation secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreated"
        "403":
          description: User-administration or owner capability is required.
        "409":
          description: The email address is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
        "403":
          description: The requested role or status change is forbidden.
        "404":
          description: User not found.
        "409":
          description: The last active owner cannot be disabled or demoted.
  /api/v1/users/{userId}/password:
    post:
      operationId: resetUserPassword
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetUserPasswordRequest"
      responses:
        "204":
          description: Credential replaced and stale sessions revoked.
        "400":
          description: Password is invalid.
        "403":
          description: The target account cannot be administered by this actor.
        "404":
          description: User not found.
  /api/v1/settings:
    get:
      operationId: listSettings
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Complete code-owned setting registry with effective values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Setting"
  /api/v1/preferences:
    get:
      operationId: getOwnPreferences
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Bounded effective preferences for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    put:
      operationId: updateOwnPreferences
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferences"
      responses:
        "200":
          description: Validated preferences persisted for the authenticated user only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/settings/{settingKey}:
    put:
      operationId: updateSetting
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: settingKey
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Validated persisted setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          description: The value is invalid for this setting.
        "403":
          description: Settings-administration capability is required.
        "404":
          description: The key is not registered.
        "409":
          description: The submitted revision is stale.
  /api/v1/roots:
    get:
      operationId: listRoots
      responses:
        "200":
          description: Registered library roots without host filesystem paths.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Root"
  /api/v1/libraries:
    get:
      operationId: listManagedLibraries
      responses:
        "200":
          description: Administrative library details including canonical host paths.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedLibrary"
        "403":
          description: Library-administration capability is required.
    post:
      operationId: createManagedLibrary
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "200":
          description: Registered library with an immutable key and canonical path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedLibrary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Library-administration capability is required.
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/libraries/validate:
    post:
      operationId: validateLibraryPath
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateLibraryPathRequest"
      responses:
        "200":
          description: Canonical path and permission observations from the daemon host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryPathValidation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Library-administration capability is required.
  /api/v1/libraries/{rootKey}:
    patch:
      operationId: updateManagedLibrary
      description: Requires the revision loaded before confirmation. Stale edits must reload and be confirmed again.
      parameters:
        - $ref: "#/components/parameters/RootKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryRequest"
      responses:
        "200":
          description: Updated safe metadata and activation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedLibrary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Library-administration capability is required.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The library revision changed; reload before retrying.
        "422":
          description: Missing or incorrectly typed expectedRevision.
  /api/v1/libraries/{rootKey}/scans:
    post:
      operationId: startLibraryScan
      parameters:
        - $ref: "#/components/parameters/RootKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLibraryScanRequest"
      responses:
        "202":
          description: Durable scan job accepted or coalesced with active work for this library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryScanResult"
        "403":
          description: Library-administration capability is required.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/operations/health:
    get:
      operationId: getOperationsHealth
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sanitized aggregate health for database, workers, backups, storage, and recent scans.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsHealth"
        "403":
          description: Library-administration capability is required.
  /api/v1/operations/support-bundle:
    post:
      operationId: createSupportBundle
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Bounded redacted support archive with an internal checksum manifest.
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Sha256: { schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
          content:
            application/x-tar:
              schema: { type: string, format: binary, maxLength: 4194304 }
        "400":
          description: Generation failed a size, timeout, path, or cleanup safety bound.
        "403":
          description: Owner/administrator, CSRF, or same-origin verification failed.
  /api/v1/conversion-profiles:
    get:
      operationId: listConversionProfiles
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Durable conversion profiles., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ConversionProfile" } } } } }
        "403": { description: Library-administration capability is required. }
    post:
      operationId: createConversionProfile
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConversionProfileCreate" } } } }
      responses:
        "201": { description: Profile created., content: { application/json: { schema: { $ref: "#/components/schemas/ConversionProfile" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Authorization, CSRF, or same-origin verification failed. }
  /api/v1/conversion-profiles/{profileId}:
    parameters:
      - { in: path, name: profileId, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateConversionProfile
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConversionProfileUpdate" } } } }
      responses:
        "200": { description: Profile updated., content: { application/json: { schema: { $ref: "#/components/schemas/ConversionProfile" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Authorization, CSRF, or same-origin verification failed. }
    delete:
      operationId: retireConversionProfile
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionConfirmation" } } } }
      responses:
        "200": { description: Profile retired without changing historical jobs., content: { application/json: { schema: { $ref: "#/components/schemas/ConversionProfile" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { description: Missing or invalid expectedRevision; reload the client before confirming. }
        "403": { description: Authorization, CSRF, or same-origin verification failed. }
  /api/v1/scan-schedules:
    get:
      operationId: listScanSchedules
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Durable scan schedules., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ScanSchedule" } } } } }
        "403": { description: Library-administration capability is required. }
    post:
      operationId: createScanSchedule
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScanScheduleCreate" } } } }
      responses:
        "201": { description: Schedule created., content: { application/json: { schema: { $ref: "#/components/schemas/ScanSchedule" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Authorization, CSRF, or same-origin verification failed. }
  /api/v1/scan-schedules/{scheduleId}:
    parameters:
      - { in: path, name: scheduleId, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateScanSchedule
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ScanScheduleUpdate" } } } }
      responses:
        "200": { description: Schedule updated., content: { application/json: { schema: { $ref: "#/components/schemas/ScanSchedule" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Authorization, CSRF, or same-origin verification failed. }
    delete:
      operationId: deleteScanSchedule
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionConfirmation" } } } }
      responses:
        "204": { description: Schedule deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { description: Missing or invalid expectedRevision; reload the client before confirming. }
        "403": { description: Authorization, CSRF, or same-origin verification failed. }
  /api/v1/retention/preview:
    get:
      operationId: previewRetention
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Non-destructive cleanup preview., content: { application/json: { schema: { $ref: "#/components/schemas/RetentionPreview" } } } }
        "403": { description: Library-administration capability is required. }
  /api/v1/retention/runs:
    post:
      operationId: runRetention
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Confirmation" } } } }
      responses:
        "200": { description: Audited safe cleanup result., content: { application/json: { schema: { $ref: "#/components/schemas/RetentionResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Authorization, CSRF, or same-origin verification failed. }
  /api/v1/jobs:
    get:
      operationId: listJobs
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum: [scan, conversion]
        - in: query
          name: status
          schema:
            type: string
            maxLength: 24
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Bounded unified scan and conversion job page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "403":
          description: Library-administration capability is required.
  /api/v1/jobs/{kind}/{jobId}:
    get:
      operationId: getJob
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JobKind"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Durable job detail and currently legal capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "403":
          description: Library-administration capability is required.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/jobs/{kind}/{jobId}/cancel:
    post:
      operationId: cancelJob
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JobKind"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobActionRequest"
      responses:
        "200":
          description: Immediate queued cancellation or durable running cancellation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Authorization, CSRF, or same-origin verification failed.
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/jobs/{kind}/{jobId}/retry:
    post:
      operationId: retryJob
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/JobKind"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobActionRequest"
      responses:
        "200":
          description: One new or previously-created idempotent retry attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Authorization, CSRF, or same-origin verification failed.
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/quarantines:
    get:
      operationId: listSourceQuarantines
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Bounded administrative inventory without host paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantinePage"
        "403":
          description: Administrative capability is required.
  /api/v1/history:
    get:
      operationId: getCatalogHistory
      parameters:
        - in: query
          name: targetType
          required: true
          schema: { type: string, enum: [model, model-file, source-file, author, tag, collection] }
        - in: query
          name: targetId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Bounded newest-first actor-aware semantic target history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogHistoryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/lifecycle/preview:
    post:
      operationId: previewCatalogLifecycle
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecyclePreviewRequest"
      responses:
        "200":
          description: Short-lived actor, resource, and revision-bound impact plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecyclePlan"
        "403":
          description: The role cannot preview this lifecycle action.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/lifecycle/plans/{planId}/apply:
    post:
      operationId: applyCatalogLifecycle
      parameters:
        - in: path
          name: planId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleApplyRequest"
      responses:
        "200":
          description: Applied lifecycle result with the resulting revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifecycleApplyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Owner or administrative capability is required by the action.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/models:
    get:
      operationId: listModels
      responses:
        "200":
          description: Persistent logical models ordered by latest update.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
    post:
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModelRequest"
      responses:
        "200":
          description: Model with one stable primary source relationship.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/models/{modelId}:
    get:
      operationId: getModel
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "200":
          description: Dedicated revisioned model detail used by the page and editor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateModel
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateModelRequest"
      responses:
        "200":
          description: Atomically updated model metadata and presentation orientation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The expected model revision is stale.
  /api/v1/models/{modelId}/files:
    get:
      operationId: listModelFiles
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Bounded stable fileset page ordered by primary state, ordinal, and path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelFilePage"
        "404":
          $ref: "#/components/responses/NotFound"
