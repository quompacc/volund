    put:
      operationId: setModelPrimarySource
      parameters:
        - $ref: "#/components/parameters/ModelId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetModelPrimaryRequest" }
      responses:
        "200":
          description: Primary source changed without replacing unrelated model metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Catalog-write capability is required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/models/{modelId}/files/{fileId}:
    patch:
      operationId: updateModelFileMetadata
      parameters:
        - $ref: "#/components/parameters/ModelId"
