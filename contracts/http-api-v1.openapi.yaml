          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/imports/latest-uploaded:
    get:
      operationId: latestUploadedImport
      description: Load the newest active draft whose complete file set is staged and hashed.
      responses:
        "200":
          description: Resumable draft, or null when none exists.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ImportDraft"
                  - type: "null"
  /api/v1/imports/{draftId}/review:
    post:
      operationId: reviewImport
      description: Persist and return a read-only deduplication and target-path plan.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deterministic import plan; no library files were changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/imports/{draftId}/items/{itemId}/resolution:
    post:
      operationId: resolveImportItem
      description: Persist one explicit conflict decision without retransferring valid bytes.
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ResolveImportItem" } } }
      responses:
        "204": { description: Resolution persisted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/imports/{draftId}/commit:
    post:
      operationId: commitImport
      description: Revalidate and atomically publish a conflict-free reviewed import.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Every reviewed file was published and linked to the model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCommit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/roots/{rootKey}/files:
    get:
      operationId: listFiles
      parameters:
        - $ref: "#/components/parameters/RootKey"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Directory"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Format"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Direction"
        - name: includeMissing
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: One deterministic page of relative source paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/roots/{rootKey}/folders:
    get:
      operationId: listFolders
      parameters:
        - $ref: "#/components/parameters/RootKey"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Directory"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Format"
        - name: includeMissing
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Virtual direct-child folders derived from immutable relative source paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/roots/{rootKey}/scans:
    get:
      operationId: listScans
      parameters:
        - $ref: "#/components/parameters/RootKey"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Newest scan runs first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/content/{sha256}:
    get:
      operationId: getContent
      parameters:
        - name: sha256
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Content identity and deduplicated source counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/files/{fileId}/previews:
    get:
      operationId: listPreviews
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Preview requests and their verified artifact metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: enqueueSourcePreview
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueuePreviewRequest"
      responses:
        "200":
          description: Durable preview request, reused when suitable work already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewEnqueue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Catalog-write capability is required.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/files/{fileId}/content:
    get:
      operationId: streamSourceFile
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          schema:
            type: string
        - name: download
          in: query
          description: Force an attachment response without changing the stored file.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Authenticated source bytes with verified size and path containment.
          headers:
            Content-Disposition:
              description: Attachment filename when download=true or the source is unsafe to render inline.
              schema: { type: string }
        "206":
          description: One satisfiable byte range.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/slicer-download/{token}:
    get:
      operationId: downloadSlicerHandoff
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 64, maxLength: 64 }
        - name: Range
          in: header
          schema: { type: string }
      responses:
        "200": { description: Attachment bytes authorized by a short-lived purpose-bound bearer token. }
        "206": { description: One satisfiable byte range. }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/files/{fileId}/move:
    post:
      operationId: moveSourceFile
      description: Move one available source file within its current library while preserving its UUID.
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFileRequest"
      responses:
        "200":
          description: Stable file identity and its previous and current paths.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveFileResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/previews/{previewId}/artifacts/{kind}:
    get:
      operationId: streamPreviewArtifact
      parameters:
        - name: previewId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [preview-glb, thumbnail-raster, assembly-manifest, diagnostics, result]
        - name: Range
          in: header
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Complete immutable artifact stream.
          headers:
            ETag:
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                const: bytes
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "206":
          description: Requested single byte range.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "304":
          description: ETag matches `If-None-Match`.
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: Byte range is invalid or unsatisfiable.
  /api/v1/artifacts/{artifactId}/content:
    get:
      operationId: streamArtifactById
      parameters:
        - name: artifactId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200": { description: Complete immutable artifact stream. }
        "206": { description: Satisfiable single byte range. }
        "304": { description: Content hash ETag matched. }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { description: Unsatisfiable or multi-range request. }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: volund_session
  parameters:
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    RootKey:
      name: rootKey
      in: path
      required: true
      schema:
        type: string
    JobKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [scan, conversion]
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Directory:
      name: directory
      in: query
      description: Normalized forward-slash directory relative to the library root.
      schema:
        type: string
        maxLength: 1024
    Search:
      name: q
      in: query
      description: Case-insensitive recursive search below the selected directory.
      schema:
        type: string
        maxLength: 200
    Format:
      name: format
      in: query
      schema:
        type: string
        enum: [step, iges, brep, stl, 3mf, obj, ply, gltf, glb]
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [path, format, size, modified]
        default: path
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
  responses:
    BadRequest:
      description: Invalid pagination query.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Library root or route does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Destination exists or the library is currently busy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    SetupStatus:
      type: object
      required: [initialized, bootstrapAvailable]
      properties:
        initialized:
          type: boolean
        bootstrapAvailable:
          type: boolean
    CreateFirstOwnerRequest:
      type: object
      required: [email, displayName, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          minLength: 1
          maxLength: 160
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
    User:
      type: object
      required: [id, email, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          maxLength: 1024
    Session:
      type: object
      required: [id, userId, email, displayName, role, idleExpiresAtUnixMs, absoluteExpiresAtUnixMs, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        idleExpiresAtUnixMs:
          type: integer
        absoluteExpiresAtUnixMs:
          type: integer
        mustChangePassword:
          type: boolean
    CurrentSession:
      type: object
      required: [sessionId, userId, email, displayName, role, mustChangePassword]
      properties:
        sessionId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        mustChangePassword:
          type: boolean
    OwnSession:
      type: object
      required:
        - id
        - current
        - createdAtUnixMs
        - lastSeenAtUnixMs
        - idleExpiresAtUnixMs
        - absoluteExpiresAtUnixMs
        - clientAddress
        - userAgent
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        createdAtUnixMs:
          type: integer
        lastSeenAtUnixMs:
          type: integer
        idleExpiresAtUnixMs:
          type: integer
        absoluteExpiresAtUnixMs:
          type: integer
        clientAddress:
          type: [string, "null"]
        userAgent:
          type: [string, "null"]
    ManagedUser:
      type: object
      required: [id, email, displayName, role, status, createdAtUnixMs, lastLoginAtUnixMs, lockedUntilUnixMs, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        status:
          type: string
          enum: [active, disabled, invited, locked]
        createdAtUnixMs:
          type: integer
        lastLoginAtUnixMs:
          type: [integer, "null"]
        lockedUntilUnixMs:
          type: [integer, "null"]
        mustChangePassword:
          type: boolean
    CreateUserRequest:
      type: object
      required: [email, displayName, role, password]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 160
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 1024
    InviteUserRequest:
      type: object
      required: [email, displayName, role]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          maxLength: 160
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
    InvitationCreated:
      type: object
      required: [user, activationToken, expiresAtUnixMs]
      properties:
        user:
          $ref: "#/components/schemas/ManagedUser"
        activationToken:
          type: string
          writeOnly: true
          minLength: 64
          maxLength: 64
        expiresAtUnixMs:
          type: integer
    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 64
          maxLength: 64
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 1024
    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 160
        role:
          type: string
          enum: [owner, administrator, editor, viewer]
        status:
          type: string
          enum: [active, disabled, locked]
    ResetUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 1024
        mustChange:
          type: boolean
          default: true
    ChangeOwnPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          writeOnly: true
          maxLength: 1024
        newPassword:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 1024
        mustChange:
          type: boolean
          default: false
    Setting:
      type: object
      required: [key, domain, valueType, value, origin, editable, sensitive, revision, effect, constraints]
      properties:
        key:
          type: string
        domain:
          type: string
        valueType:
          type: string
          enum: [string, enum, integer, boolean, secret]
        value: {}
        origin:
          type: string
          enum: [default, persisted, environment]
        editable:
          type: boolean
        sensitive:
          type: boolean
        configured:
          type: boolean
          description: Present for sensitive settings; secret material is never returned.
        revision:
          type: integer
          minimum: 0
        effect:
          type: string
          enum: [immediate, restart, migration]
        constraints:
          type: object
    UpdateSettingRequest:
      type: object
      required: [value, expectedRevision]
      properties:
        value: {}
        expectedRevision:
          type: integer
          minimum: 0
        confirmation:
          type: [string, "null"]
          maxLength: 128
    UserPreferences:
      type: object
      required: [previewAutoLoad, background, gridVisible, contrast, renderStyle, problemMinimumSeverity, revision]
      properties:
        previewAutoLoad: { type: string, enum: [manual, selected, visible] }
        background: { type: string, enum: [dark, light, system] }
        gridVisible: { type: boolean }
        contrast: { type: string, enum: [balanced, high] }
        renderStyle: { type: string, enum: [solid, wireframe] }
        problemMinimumSeverity: { type: string, enum: [info, warning, error] }
        revision: { type: integer, minimum: 0 }
    UpdateUserPreferences:
      type: object
      required: [previewAutoLoad, background, gridVisible, contrast, renderStyle, problemMinimumSeverity, expectedRevision]
      properties:
        previewAutoLoad: { type: string, enum: [manual, selected, visible] }
        background: { type: string, enum: [dark, light, system] }
        gridVisible: { type: boolean }
        contrast: { type: string, enum: [balanced, high] }
        renderStyle: { type: string, enum: [solid, wireframe] }
        problemMinimumSeverity: { type: string, enum: [info, warning, error] }
        expectedRevision: { type: integer, minimum: 0 }
    RevisionConfirmation:
      type: object
      required: [confirmation, expectedRevision]
      properties:
        confirmation: { type: string, maxLength: 128 }
        expectedRevision: { type: integer, description: Revision displayed when opening the confirmation dialog. }
    Confirmation:
      type: object
      required: [confirmation]
      properties:
        confirmation: { type: string, maxLength: 128 }
    ConversionProfileInput:
      type: object
      required: [name, nativePreset, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        nativePreset: { type: string, enum: [web, fine] }
        linearDeflection: { type: [number, "null"], minimum: 0.000001, maximum: 1000 }
        angularDeflection: { type: [number, "null"], minimum: 0.01, maximum: 3.141592653589793 }
        enabled: { type: boolean }
    ConversionProfileCreate:
      allOf:
        - $ref: "#/components/schemas/ConversionProfileInput"
        - type: object
          required: [confirmation]
          properties: { confirmation: { type: string, maxLength: 128 } }
    ConversionProfileUpdate:
      allOf:
        - $ref: "#/components/schemas/ConversionProfileInput"
        - type: object
          required: [expectedRevision, confirmation]
          properties:
            expectedRevision: { type: integer, minimum: 1 }
            confirmation: { type: string, maxLength: 128 }
    ConversionProfile:
      allOf:
        - $ref: "#/components/schemas/ConversionProfileInput"
        - type: object
          required: [id, builtIn, revision]
          properties:
            id: { type: string, format: uuid }
            builtIn: { type: boolean }
            revision: { type: integer, minimum: 1 }
    ScanScheduleInput:
      type: object
      required: [libraryId, name, localTime, timeZone, weekdayMask, fullScan, enabled]
      properties:
        libraryId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        localTime: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$" }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        weekdayMask: { type: integer, minimum: 1, maximum: 127 }
        fullScan: { type: boolean }
        enabled: { type: boolean }
    ScanScheduleCreate:
      allOf:
        - $ref: "#/components/schemas/ScanScheduleInput"
        - type: object
          required: [confirmation]
          properties: { confirmation: { type: string, maxLength: 128 } }
    ScanScheduleUpdate:
      allOf:
        - $ref: "#/components/schemas/ScanScheduleInput"
        - type: object
          required: [expectedRevision, confirmation]
          properties:
            expectedRevision: { type: integer, minimum: 1 }
            confirmation: { type: string, maxLength: 128 }
    ScanSchedule:
      allOf:
        - $ref: "#/components/schemas/ScanScheduleInput"
        - type: object
          required: [id, libraryName, nextRunAtUnixMs, lastScheduledAtUnixMs, lastOutcome, lastScanId, lastScanStatus, revision]
          properties:
            id: { type: string, format: uuid }
            libraryName: { type: string }
            nextRunAtUnixMs: { type: [integer, "null"] }
            lastScheduledAtUnixMs: { type: [integer, "null"] }
            lastOutcome: { type: [string, "null"] }
            lastScanId: { type: [string, "null"] }
            lastScanStatus: { type: [string, "null"] }
            revision: { type: integer, minimum: 1 }
    RetentionPreview:
      type: object
      required: [artifactRuns, artifactFiles, artifactBytes, diagnostics, reasonCodes]
      properties:
        artifactRuns: { type: integer, minimum: 0 }
        artifactFiles: { type: integer, minimum: 0 }
        artifactBytes: { type: integer, minimum: 0 }
        diagnostics: { type: integer, minimum: 0 }
        reasonCodes: { type: array, items: { type: string } }
    RetentionResult:
      type: object
      required: [id, status, artifactRuns, artifactFiles, artifactBytes, diagnosticsCleared, resultCodes]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [completed, partial, failed] }
        artifactRuns: { type: integer, minimum: 0 }
        artifactFiles: { type: integer, minimum: 0 }
        artifactBytes: { type: integer, minimum: 0 }
        diagnosticsCleared: { type: integer, minimum: 0 }
        resultCodes: { type: array, items: { type: string } }
    Root:
      type: object
      required:
        - id
        - key
        - name
        - readOnly
        - fileCount
        - missingFileCount
        - latestScanStatus
      properties:
        id:
          type: string
          format: uuid
        key:
