[package]
name = "volundd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.9"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10.4"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.16", features = ["io"] }
tower-http = { version = "0.6.6", features = ["fs", "set-header"] }
unicode-normalization = "0.1.25"
volund-core = { path = "../../crates/volund-core" }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
