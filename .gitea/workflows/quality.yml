name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  debian-native:
    runs-on: ubuntu-latest
    container: node:20-trixie
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: volund_ci_test
          POSTGRES_USER: volund_ci
          POSTGRES_PASSWORD: volund_ci
        options: >-
          --health-cmd "pg_isready -U volund_ci -d volund_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEBIAN_FRONTEND: noninteractive
      VOLUND_TEST_DATABASE_URL: postgres://volund_ci:volund_ci@postgres:5432/volund_ci_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian 13 build dependencies
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          ca-certificates git build-essential cmake pkg-config
          cargo rustc rust-clippy rustfmt
          libassimp-dev assimp-utils
          libocct-foundation-dev libocct-modeling-data-dev
          libocct-modeling-algorithms-dev libocct-visualization-dev
          libocct-ocaf-dev libocct-data-exchange-dev
          postgresql-client && rm -rf /var/lib/apt/lists/*

      - name: Record toolchain versions
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          cmake --version
          psql --version

      - name: Install locked web dependencies
        working-directory: apps/volund-web
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint every Rust target
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test and build web application
        working-directory: apps/volund-web
        run: |
          npm test -- --run
          npm run build
          npm audit

      - name: Build and test native converter
        run: |
          cmake -S native/cad-convert -B build/cad-convert -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cad-convert --parallel 2
          ctest --test-dir build/cad-convert --output-on-failure

      - name: Run complete Rust and PostgreSQL gate
        env:
          VOLUND_TEST_RUNNER: ${{ gitea.workspace }}/target/debug/volundd
        run: cargo test --workspace

      - name: Audit Rust lockfile
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit --ignore RUSTSEC-2023-0071
