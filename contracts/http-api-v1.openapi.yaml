    CollectionDetail:
      allOf:
        - $ref: "#/components/schemas/Collection"
        - type: object
          required: [modelIds]
          properties:
            modelIds: { type: array, maxItems: 1000, items: { type: string, format: uuid } }
    CollectionUpdate:
      allOf:
        - $ref: "#/components/schemas/CreateCollectionRequest"
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision: { type: integer, minimum: 1 }
    MembershipUpdate:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
    CollectionRemoval:
      type: object
      required: [expectedRevision, confirmation]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        confirmation: { type: string, maxLength: 128 }
    TagInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
    TagUpdate:
      type: object
      required: [expectedRevision, name]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 50 }
    TagMerge:
      type: object
      required: [expectedRevision, targetTagId, confirmation]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        targetTagId: { type: string, format: uuid }
        confirmation: { type: string, maxLength: 128 }
    TagRemoval:
      type: object
      required: [expectedRevision, confirmation]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        confirmation: { type: string, maxLength: 128 }
    Tag:
      type: object
      required: [id, name, active, mergedIntoId, modelCount, revision, updatedAtUnixMs]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        mergedIntoId: { type: [string, "null"], format: uuid }
        modelCount: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        updatedAtUnixMs: { type: integer }
    TagPage:
      type: object
      required: [items, limit, offset, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Tag" } }
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
    ImportManifestEntry:
      type: object
      required: [path, byteSize]
      properties:
        path:
          type: string
        byteSize:
          type: integer
          minimum: 0
    ImportPreviewRequest:
      type: object
      required: [sourceName, entries]
      properties:
        sourceName:
          type: string
        entries:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ImportManifestEntry"
    ImportDraftItem:
      type: object
      required: [id, originalPath, byteSize, category, suggestedRelativePath, isPrimaryCandidate, uploadStatus]
      properties:
        id:
          type: string
          format: uuid
        originalPath:
          type: string
        byteSize:
          type: integer
          minimum: 0
        category:
          type: string
          enum: [cad, mesh, document, image, archive, other]
        suggestedRelativePath:
          type: string
        isPrimaryCandidate:
          type: boolean
        uploadStatus:
          type: string
          enum: [pending, uploading, uploaded]
    ImportDraft:
      type: object
      required: [id, sourceName, suggestedModelName, suggestedSlug, totalFiles, totalBytes, items]
      properties:
        id:
          type: string
          format: uuid
        sourceName:
          type: string
        suggestedModelName:
          type: string
        suggestedSlug:
          type: string
        totalFiles:
          type: integer
          minimum: 1
        totalBytes:
          type: integer
          minimum: 0
          maximum: 10737418240
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportDraftItem"
    ImportDraftLifecycle:
      type: object
      required: [id, displayName, status, actorId, actorName, totalFiles, uploadedFiles, totalBytes, uploadedBytes, createdAtUnixMs, updatedAtUnixMs, expiresAtUnixMs, targetAction, targetModelId, lastErrorCode, resultModelId, canRetry, canCancel]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, maxLength: 160 }
        status: { type: string, enum: [draft, uploading, uploaded, review_ready, reviewed, committing, committed, failed, cancelled, expired] }
        actorId: { type: [string, "null"], format: uuid }
        actorName: { type: [string, "null"] }
        totalFiles: { type: integer, minimum: 1 }
        uploadedFiles: { type: integer, minimum: 0 }
        totalBytes: { type: integer, minimum: 0 }
        uploadedBytes: { type: integer, minimum: 0 }
        createdAtUnixMs: { type: integer }
        updatedAtUnixMs: { type: integer }
        expiresAtUnixMs: { type: integer }
        targetAction: { type: [string, "null"], enum: [create, update, extend, null] }
        targetModelId: { type: [string, "null"], format: uuid }
        lastErrorCode: { type: [string, "null"] }
        resultModelId: { type: [string, "null"], format: uuid }
        canRetry: { type: boolean }
        canCancel: { type: boolean }
    ImportDraftPage:
      type: object
      required: [items, limit, offset, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImportDraftLifecycle" } }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    ImportStorage:
      type: object
      required: [reservedBytes, uploadedBytes, reclaimableBytes, capacityBytes]
      properties:
        reservedBytes: { type: integer, minimum: 0 }
        uploadedBytes: { type: integer, minimum: 0 }
        reclaimableBytes: { type: integer, minimum: 0 }
        capacityBytes: { type: integer, minimum: 0 }
    RenameImport:
      type: object
      required: [displayName]
      properties: { displayName: { type: string, minLength: 1, maxLength: 160 } }
    CancelImport:
      type: object
      required: [confirmation]
      properties: { confirmation: { type: string } }
    ImportCancel:
      type: object
      required: [id, status, stagingCleaned]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [cancelled] }
        stagingCleaned: { type: boolean }
    ResolveImportItem:
      type: object
      required: [action, targetPath]
      properties:
        action: { type: string, enum: [create, reuse, relocate, skip] }
        targetPath: { type: [string, "null"] }
    ConfigureImportRequest:
      type: object
      required: [modelName, kind, libraryRootId, description, authorName, tags, collectionIds]
      properties:
        modelName:
          type: string
          minLength: 1
          maxLength: 160
        kind:
          type: string
          enum: [part, assembly, project]
        libraryRootId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 4000
        authorName:
          type: [string, "null"]
          maxLength: 160
        tags:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 50
        collectionIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
        targetAction:
          type: [string, "null"]
          enum: [create, update, extend, null]
        targetModelId:
          type: [string, "null"]
          format: uuid
        expectedModelRevision:
          type: [integer, "null"]
          minimum: 1
        licenseKind:
          type: [string, "null"]
          enum: [not-specified, spdx, custom, null]
        licenseValue:
          type: [string, "null"]
          maxLength: 160
        primaryItemId:
          type: [string, "null"]
          format: uuid
        thumbnailItemId:
          type: [string, "null"]
          format: uuid
    ImportConfiguration:
      allOf:
        - $ref: "#/components/schemas/ConfigureImportRequest"
        - type: object
          required: [id, slug, readyForUpload, targetAction, targetModelId, expectedModelRevision, licenseKind, licenseValue, primaryItemId, thumbnailItemId]
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            readyForUpload:
              type: boolean
            targetAction: { type: string, enum: [create, update, extend] }
            targetModelId: { type: [string, "null"], format: uuid }
            expectedModelRevision: { type: [integer, "null"], minimum: 1 }
            licenseKind: { type: string, enum: [not-specified, spdx, custom] }
            licenseValue: { type: [string, "null"] }
            primaryItemId: { type: [string, "null"], format: uuid }
            thumbnailItemId: { type: [string, "null"], format: uuid }
    ImportUpload:
      type: object
      required: [draftId, itemId, byteSize, sha256, status, alreadyUploaded]
      properties:
        draftId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        byteSize:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        status:
          type: string
          enum: [uploaded]
        alreadyUploaded:
          type: boolean
    ImportReviewItem:
      type: object
      required: [id, originalPath, category, byteSize, sha256, action, targetPath, existingFileId, existingPath, isPrimary]
      properties:
        id:
          type: string
          format: uuid
        originalPath:
          type: string
        category:
          type: string
          enum: [cad, mesh, document, image, archive, other]
        byteSize:
          type: integer
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        action:
          type: string
          enum: [create, reuse, relocate, conflict, skip]
        targetPath:
          type: string
        existingFileId:
          type: [string, "null"]
          format: uuid
        existingPath:
          type: [string, "null"]
        isPrimary:
          type: boolean
    ImportReview:
      type: object
      required: [draftId, modelName, modelAction, existingModelId, rootKey, rootName, baseDirectory, createFiles, reuseFiles, relocateFiles, conflicts, skipFiles, newBytes, savedBytes, items]
      properties:
        draftId:
          type: string
          format: uuid
        modelName:
          type: string
        modelAction:
          type: string
          enum: [create, update, extend]
        existingModelId:
          type: [string, "null"]
          format: uuid
        rootKey:
          type: string
        rootName:
          type: string
        baseDirectory:
          type: string
        createFiles:
          type: integer
          minimum: 0
        reuseFiles:
          type: integer
          minimum: 0
        relocateFiles:
          type: integer
          minimum: 0
        conflicts:
          type: integer
          minimum: 0
        skipFiles:
          type: integer
          minimum: 0
        newBytes:
          type: integer
          minimum: 0
        savedBytes:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportReviewItem"
    ImportCommit:
      type: object
      required: [draftId, modelId, modelName, totalFiles, createdFiles, reusedFiles, relocatedFiles, status]
      properties:
        draftId:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
        modelName:
          type: string
        totalFiles:
          type: integer
          minimum: 1
        createdFiles:
          type: integer
          minimum: 0
        reusedFiles:
          type: integer
          minimum: 0
        relocatedFiles:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [committed]
    Folder:
      type: object
      required: [name, path, fileCount]
      properties:
        name:
          type: string
        path:
          type: string
          description: Forward-slash path relative to its library root.
        fileCount:
          type: integer
          minimum: 1
    Scan:
      type: object
      required:
        - id
        - status
        - startedAtUnixMs
        - finishedAtUnixMs
        - discoveredFiles
        - hashedFiles
        - missingFiles
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        startedAtUnixMs:
          type: integer
        finishedAtUnixMs:
          type: [integer, "null"]
        discoveredFiles:
          type: integer
          minimum: 0
        hashedFiles:
          type: integer
          minimum: 0
        missingFiles:
          type: integer
          minimum: 0
    Content:
      type: object
      required:
        - sha256
        - byteSize
        - format
        - sourceCount
        - availableSourceCount
      properties:
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        byteSize:
          type: integer
          minimum: 0
        format:
          type: [string, "null"]
          enum: [step, iges, brep, stl, 3mf, obj, ply, gltf, glb, null]
        sourceCount:
          type: integer
          minimum: 0
        availableSourceCount:
          type: integer
          minimum: 0
    Preview:
      type: object
      required:
        - id
        - profile
        - status
        - converterVersion
        - requestedAtUnixMs
        - finishedAtUnixMs
        - artifacts
      properties:
        id:
          type: string
          format: uuid
        profile:
          type: string
          enum: [web, fine]
        status:
          type: string
        converterVersion:
          type: string
        requestedAtUnixMs:
          type: integer
        finishedAtUnixMs:
          type: [integer, "null"]
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
    Artifact:
      type: object
      required: [kind, url, sha256, byteSize, mediaType]
      properties:
        kind:
          type: string
          enum: [preview-glb, thumbnail-raster, assembly-manifest, diagnostics, result]
        url:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        byteSize:
          type: integer
          minimum: 0
        mediaType:
          type: string
    FilePage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/File"
    FolderPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Folder"
    ScanPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Scan"
    PreviewPage:
      allOf:
        - $ref: "#/components/schemas/PageMetadata"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Preview"
    PageMetadata:
      type: object
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
