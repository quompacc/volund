        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateModelFileRequest" }
      responses:
        "200":
          description: Revisioned metadata for exactly one model/source relationship.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Catalog-write capability is required. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/models/{modelId}/files/{fileId}/slicer-handoff:
    post:
      operationId: createSlicerHandoff
      parameters:
        - $ref: "#/components/parameters/ModelId"
